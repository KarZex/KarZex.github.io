<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB量子化＋HEX出力＋ZIPダウンロード</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        h3 {
            font-size: 1.1rem;
            margin-top: 24px;
            margin-bottom: 8px;
        }

        /* ファイル入力エリア */
        .file-upload-wrapper {
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .file-label:hover {
            background-color: var(--primary-hover);
        }

        /* Canvas (画像表示エリア) */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .preview-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .preview-card h4 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #64748b;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: #fff;
        }

        /* テキストエリア */
        textarea {
            width: 100%;
            height: 200px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            background-color: #0f172a;
            color: #38bdf8;
        }

        /* ダウンロードボタン */
        .btn-download {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }

        .btn-download:hover {
            background-color: #059669;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>RGB量子化（9値）＋ HEX出力</h2>

        <div class="file-upload-wrapper">
            <label for="fileInput" class="file-label">画像ファイルを選択</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-grid">
            <div class="preview-card">
                <h4>元画像</h4>
                <canvas id="canvasOriginal"></canvas>
            </div>
            <div class="preview-card">
                <h4>量子化後</h4>
                <canvas id="canvasQuantized"></canvas>
            </div>
        </div>

        <h3>量子化後のピクセルデータ（HEX）</h3>
        <textarea id="pixelData" readonly placeholder="画像を選択するとデータが表示されます"></textarea>

        <button id="downloadZip" class="btn-download">ZIPダウンロード</button>
    </div>

    <script>
        const levels = [0, 32, 64, 96, 128, 160, 192, 224, 255];
        let generatedText = "";  // ZIPに入れる内容

        function quantize(value) {
            let best = levels[0];
            let minDist = Math.abs(value - best);
            for (let lv of levels) {
                const d = Math.abs(value - lv);
                if (d < minDist) {
                    minDist = d;
                    best = lv;
                }
            }
            return best;
        }

        function toHex(v) {
            return v.toString(16).padStart(2, "0");
        }

        document.getElementById("fileInput").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = function () {
                const w = img.width;
                const h = img.height;

                const c0 = document.getElementById("canvasOriginal");
                c0.width = w;
                c0.height = h;
                const ctx0 = c0.getContext("2d");
                ctx0.drawImage(img, 0, 0);

                const c1 = document.getElementById("canvasQuantized");
                c1.width = w;
                c1.height = h;
                const ctx1 = c1.getContext("2d");

                const imgData = ctx0.getImageData(0, 0, w, h);
                const data = imgData.data;

                let output = "";

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;

                        const r = quantize(data[i]);
                        const g = quantize(data[i + 1]);
                        const b = quantize(data[i + 2]);

                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;

                        const hex = toHex(r) + toHex(g) + toHex(b);

                        output += `X:${x}Y:${y},${hex}\n`;
                    }
                }

                ctx1.putImageData(imgData, 0, 0);

                document.getElementById("pixelData").value = output;
                generatedText = output;  // ZIP用に保存
            };

            img.src = URL.createObjectURL(file);
        });

        // ZIP生成＋ダウンロード
        document.getElementById("downloadZip").addEventListener("click", function () {
            if (!generatedText) {
                alert("先に画像を量子化してください");
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder("test");  // testフォルダを作成

            folder.file("quantized.txt", generatedText);  // ファイルを追加

            zip.generateAsync({ type: "blob" }).then(function (content) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "quantized_data.zip";
                a.click();
            });
        });
    </script>

</body>

</html>
