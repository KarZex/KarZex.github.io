<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>RGB量子化デモ</title>
    <style>
        body {
            font-family: sans-serif;
        }

        canvas {
            border: 1px solid #333;
            margin: 10px;
        }
    </style>
</head>

<body>

    <h2>RGB量子化（9値）デモ</h2>
    <input type="file" id="fileInput" accept="image/*"><br>

    <canvas id="canvasOriginal"></canvas>
    <canvas id="canvasQuantized"></canvas>

    <script>
        const levels = [0, 32, 64, 96, 128, 160, 192, 224, 255];

        // 最も近い量子化レベルを返す
        function quantize(value) {
            let best = levels[0];
            let minDist = Math.abs(value - best);
            for (let lv of levels) {
                const d = Math.abs(value - lv);
                if (d < minDist) {
                    minDist = d;
                    best = lv;
                }
            }
            return best;
        }

        document.getElementById("fileInput").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = function () {
                const w = img.width;
                const h = img.height;

                // 元画像表示
                const c0 = document.getElementById("canvasOriginal");
                c0.width = w;
                c0.height = h;
                const ctx0 = c0.getContext("2d");
                ctx0.drawImage(img, 0, 0);

                // 量子化画像表示
                const c1 = document.getElementById("canvasQuantized");
                c1.width = w;
                c1.height = h;
                const ctx1 = c1.getContext("2d");

                const imgData = ctx0.getImageData(0, 0, w, h);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    data[i] = quantize(data[i]);     // R
                    data[i + 1] = quantize(data[i + 1]);   // G
                    data[i + 2] = quantize(data[i + 2]);   // B
                }

                ctx1.putImageData(imgData, 0, 0);
            };

            img.src = URL.createObjectURL(file);
        });
    </script>

</body>

</html>
