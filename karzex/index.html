<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>RGB量子化＋HEX出力＋ZIPダウンロード</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
        }

        canvas {
            border: 1px solid #333;
            margin: 10px;
        }

        textarea {
            width: 600px;
            height: 300px;
        }
    </style>
</head>

<body>

    <h2>RGB量子化（9値）＋ HEX出力 ＋ ZIPダウンロード</h2>
    <input type="file" id="fileInput" accept="image/*"><br>

    <canvas id="canvasOriginal"></canvas>
    <canvas id="canvasQuantized"></canvas>

    <h3>量子化後のピクセルデータ（HEX）</h3>
    <textarea id="pixelData"></textarea><br>

    <button id="downloadZip">ZIPダウンロード</button>

    <script>
        const levels = [0, 32, 64, 96, 128, 160, 192, 224, 255];
        let generatedText = "";  // ZIPに入れる内容

        function quantize(value) {
            let best = levels[0];
            let minDist = Math.abs(value - best);
            for (let lv of levels) {
                const d = Math.abs(value - lv);
                if (d < minDist) {
                    minDist = d;
                    best = lv;
                }
            }
            return best;
        }

        function toHex(v) {
            return v.toString(16).padStart(2, "0");
        }

        document.getElementById("fileInput").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const img = new Image();
            img.onload = function () {
                const w = img.width;
                const h = img.height;

                const c0 = document.getElementById("canvasOriginal");
                c0.width = w;
                c0.height = h;
                const ctx0 = c0.getContext("2d");
                ctx0.drawImage(img, 0, 0);

                const c1 = document.getElementById("canvasQuantized");
                c1.width = w;
                c1.height = h;
                const ctx1 = c1.getContext("2d");

                const imgData = ctx0.getImageData(0, 0, w, h);
                const data = imgData.data;

                let output = "";

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const i = (y * w + x) * 4;

                        const r = quantize(data[i]);
                        const g = quantize(data[i + 1]);
                        const b = quantize(data[i + 2]);

                        data[i] = r;
                        data[i + 1] = g;
                        data[i + 2] = b;

                        const hex = toHex(r) + toHex(g) + toHex(b);

                        output += `X:${x}Y:${y},${hex}\n`;
                    }
                }

                ctx1.putImageData(imgData, 0, 0);

                document.getElementById("pixelData").value = output;
                generatedText = output;  // ZIP用に保存
            };

            img.src = URL.createObjectURL(file);
        });

        // ZIP生成＋ダウンロード
        document.getElementById("downloadZip").addEventListener("click", function () {
            if (!generatedText) {
                alert("先に画像を量子化してください");
                return;
            }

            const zip = new JSZip();
            const folder = zip.folder("test");  // testフォルダを作成

            folder.file("quantized.txt", generatedText);  // ファイルを追加

            zip.generateAsync({ type: "blob" }).then(function (content) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(content);
                a.download = "quantized_data.zip";
                a.click();
            });
        });
    </script>

</body>

</html>
